name: Gerar APK Velora

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Criar projeto Flutter Android
        run: |
          flutter create . \
            --project-name=miniseries_ia \
            --platforms=android

      - name: Criar código do aplicativo
        run: bash setup.sh

      
      - name: Atualizar login e cadastro
        run: bash auth_upgrade.sh
      - name: Personalizar login Velora
        run: bash velora_login_premium.sh 
      - name: Habilitar internet no Android
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application/' android/app/src/main/AndroidManifest.xml

      - name: Alterar nome para Velora
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          arquivo = Path('android/app/src/main/AndroidManifest.xml')
          texto = arquivo.read_text()
          texto, n = re.subn(
              r'android:label="[^"]*"',
              'android:label="Velora"',
              texto,
              count=1
          )
          if n != 1:
              raise RuntimeError('Nome do app não encontrado')
          arquivo.write_text(texto)
          PY
      - name: Configurar icone Velora
        run: |
          mkdir -p assets
          cp velora_icon.png assets/velora_icon.png
          flutter pub add --dev flutter_launcher_icons
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/velora_icon.png"
          EOF
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
      - name: Configurar abertura Velora
        run: |
         flutter pub add --dev flutter_native_splash
         cp velora_splash.png assets/velora_splash.png
          cat > flutter_native_splash.yaml <<'EOF'
                    flutter_native_splash:
            color: "#000000"
            color_dark: "#000000"
            image: assets/velora_splash.png
            android: true
            ios: false
            android_12:
              color: "#000000"
              color_dark: "#000000"
              image: assets/velora_splash.png
              image_dark: assets/velora_splash.png
              icon_background_color: "#000000"
              icon_background_color_dark: "#000000"
          EOF
          dart run flutter_native_splash:create
       - name: Corrigir tema Android Velora
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path("android/app/src/main/res")

          for arquivo in base.glob("values*/styles.xml"):
              texto = arquivo.read_text()

              for tema in ("LaunchTheme", "NormalTheme"):
                  padrao = (
                      r'(<style\s+name="' + tema +
                      r'"[^>]*>)(.*?)(</style>)'
                  )

                  def corrigir(m):
                      conteudo = re.sub(
                          r'<item name="android:windowBackground">.*?</item>',
                          '',
                          m.group(2),
                          flags=re.S
                      )
                      conteudo += (
                          '\n<item name="android:windowBackground">'
                          '@android:color/black</item>\n'
                      )
                      return m.group(1) + conteudo + m.group(3)

                  texto = re.sub(
                      padrao, corrigir, texto, flags=re.S
                  )

              arquivo.write_text(texto)
              print("Tema atualizado:", arquivo)
          PY
      - name: Verificar permissao de internet
        run: |
          cat android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
      - name: Configurar links de autenticacao Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          intent_filter = """
                  <intent-filter android:autoVerify="false">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="miniseriesia" />
                  </intent-filter>
          """

          if 'android:scheme="miniseriesia"' not in content:
              content = content.replace(
                  "</activity>",
                  intent_filter + "\n        </activity>",
                  1
              )
              path.write_text(content)
          PY
      - name: Instalar dependencias
        run: flutter pub get


      - name: Gerar APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://bimbcsyttujxnzusimol.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_BLVUNk3KKqBgff8PQ9_q5g_F4Djwbcb

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniSeries-IA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
